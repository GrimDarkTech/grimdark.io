<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{site.meta.home.title}}</title>
    <link rel="icon" href="{{root}}{{site.assets.favicon}}">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style_adaptation.css">
    <script defer src="js/data.js"></script>
    <script defer src="js/main.js"></script>
</head>

<body data-page="home" data-root="">
    <section class="parallax">
        <div class="overlay">
            <div class="parallax__content container">
                <div class="parallax__header">
                    <div class="parallax__header-menu__logo">
                        <a href="#">
                            <img class="logo-a__Company" src="{{root}}{{site.assets.companyLogo}}" alt="{{site.assets.companyLogoAlt}}">
                        </a>
                    </div>
                <div class="header__menu">
                    <div class="menu__menu-burger">
                        <span></span>
                    </div>
                    <nav class="header-menu__body">
                        <ul class="header-menu__list">
                            <template data-repeat="site.nav" data-as="n">
                                <li><a href="{{root}}{{n.href}}" class="header-menu__link">{{n.label}}</a></li>
                            </template>
                        </ul>
                    </nav>
                </div>
                </div>
                <div class="parallax-container">
                    <div class="parallax-container__text">
                        <template data-repeat="site.project.heroWords" data-as="w">
                            <div class="parallax-container__word">
                                <h1 class="parallax-container__text_h">{{w.letter}}</h1>
                                <p class="parallax-container__text_p">{{w.word}}</p>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="about" id="about">
        <div class="container">
            <h2 class="container__title">{{page.features.title}}</h2>
            <div class="columns_about">
                <template data-repeat="page.features.items" data-as="f">
                    <a href="{{f.href}}" class="columns_about_blocks animation-p _anim-items">
                        <img alt="{{f.alt}}" src="{{root}}{{f.icon}}" class="about_icons">
                        <h3 class="columns_about_blocks_text">{{f.title}}</h3>
                        <p class="columns_about_blocks_text">{{f.text}}</p>
                    </a>
                </template>
            </div>
        </div>
    </section>

    <section class="about_rsma" id="about_rsma">
        <div class="container">
            <h2 class="container__title">{{page.why.title}}</h2>
            <template data-repeat="page.why.paragraphs" data-as="p">
                <p class="about_rsma_p">{{p}}</p>
            </template>
            <div class="about_rsma_container_media">
                <template data-repeat="page.why.videos" data-as="v">
                    <a class="about_rsma_media" onclick="openVideo({{v.id}})">
                        <img alt="{{v.thumbAlt}}" src="{{root}}{{v.thumb}}" class="about_rsma_img">
                    </a>
                </template>
                <template data-repeat="page.why.videos" data-as="v">
                    <div class="container_video" id="container_video{{v.id}}">
                        <button class="cross" onclick="closeVideo({{v.id}})"><img alt="X" src="{{root}}images/cross_mr3w4khsljuu.svg"></button>
                        <iframe id="video{{v.id}}" width="560" height="315" src="{{v.src}}" data-src="{{v.src}}" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                    </div>
                </template>
            </div>
        </div>
    </section>
    <section class="tariff" id="tariff">
        <div class="container">
            <h2 class="container__title">{{page.tariff.title}}</h2>
            <div>
                <table>
                    <thead>
                        <tr>
                            <th></th>
                            <th class="tariff_th_title_h">{{page.tariff.columns.0}}</th>
                            <th class="tariff_th_title_h">{{page.tariff.columns.1}}</th>
                            <th class="tariff_th_title_h">{{page.tariff.columns.2}}</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template data-repeat="page.tariff.rows" data-as="row">
                            <tr>
                                <th>{{row.name}}</th>
                                <td data-if="row.basic"><img alt="Да" src="{{root}}images/tick_vlltchoso6eq.svg" class="tariff_img"></td>
                                <td data-if="row.standart"><img alt="Да" src="{{root}}images/tick_vlltchoso6eq.svg" class="tariff_img"></td>
                                <td data-if="row.premium"><img alt="Да" src="{{root}}images/tick_vlltchoso6eq.svg" class="tariff_img"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="table_title_container">
                    <h3 class="tariff_th_title_h tariff_th_title_h_th"></h3>
                    <template data-repeat="page.tariff.tiers" data-as="t">
                        <a href="Tariff/index.html"><button class="button" onclick="addStorage('{{t.id}}')">{{page.tariff.detailButton}}</button></a>
                    </template>
                </div>
                <div id="containerForAdapt">
                    <a href="Tariff/index.html"><button id="buttonForAdapt" class="button" onclick="addStorage('basic')">{{page.tariff.detailButton}}</button></a>
                </div>
            </div>
        </div>
    </section>

    <section class="contacts" id="contacts">
        <div class="container">
            <h2 class="container__title">{{page.contacts.title}}</h2>
            <template data-repeat="page.contacts.lines" data-as="line">
                <p>{{line}}</p>
            </template>
            <p class="contacts_fond_p" data-html="page.contacts.note"></p>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="parallax_footer_logo">
                <div class="footer_container_logo">
                    <a href="{{site.foundationUrl}}">
                        <img class="logo-a__Found" src="{{root}}{{site.assets.foundationLogo}}" alt="{{site.assets.foundationAlt}}">
                    </a>
                    <a href="#">
                        <img class="logo-a__Company" src="{{root}}{{site.assets.companyLogo}}" alt="{{site.assets.companyLogoAlt}}">
                    </a>
                </div>
                <div class="container_logo_footer">
                    <template data-repeat="site.socials" data-as="s">
                        <a href="{{s.url}}">
                            <img src="{{root}}{{s.icon}}" alt="{{s.label}}" class="logo_footer">
                        </a>
                    </template>
                </div>
            </div>
            <div class="container_footer_text">
                <p class="footer__copyright">{{site.footer.copyright}}</p>
                <a href="{{site.footer.companyLink.href}}" class="footer_link">{{site.footer.companyLink.label}}</a>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/seamless-scroll-polyfill@latest/lib/bundle.min.js"></script>
</body>

</html>
