<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{site.meta.tariffs.title}}</title>
    <link rel="icon" href="{{root}}{{site.assets.favicon}}">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style_adaptation.css">
    <script defer src="../js/data.js"></script>
    <script defer src="../js/main.js"></script>
    <script defer src="../js/tariffs.js"></script>
</head>

<body data-page="tariffs" data-root="../">
    <header class="header">
        <div class="container">
            <div class="header_logo">
                <a href="#">
                    <img class="logo-a__Company" src="{{root}}{{site.assets.companyLogo}}" alt="{{site.assets.companyLogoAlt}}">
                </a>
                <div class="header_menu">
                    <div class="menu_menu-burger">
                        <span></span>
                    </div>
                    <nav class="header-menu__body">
                        <ul class="header-menu__list">
                            <template data-repeat="site.nav" data-as="n">
                                <li><a href="{{root}}{{n.href}}" class="header-menu__link">{{n.label}}</a></li>
                            </template>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
        <div class="header_tariff">
            <div class="container">
                <div class="header_tariff_title_container">
                    <template data-repeat="page.tiers" data-as="t">
                        <button class="header_tariff_title" onclick="openTariff('{{t.id}}')"><h2 id="title_{{t.id}}" class="header_tariff_title_h">{{t.label}}</h2></button>
                    </template>
                </div>
            </div>
        </div>
    </header>

    <section class="tariff" id="tariff">
        <div class="container">
            <h2 class="container__title">{{page.title}}</h2>
            <template data-repeat="page.tiers" data-as="t">
                <div id="tariff_container_{{t.id}}" hidden>
                    <table>
                        <tbody>
                            <template data-repeat="t.rows" data-as="row">
                                <tr>
                                    <th colspan="2">{{row.name}}</th>
                                    <td colspan="2"><p>{{row.price}}</p></td>
                                </tr>
                            </template>
                            <tr>
                                <th>{{page.purchaseLabel}}</th>
                                <td><p>{{t.purchase}}</p></td>
                                <th>{{page.subscriptionLabel}}</th>
                                <td><p>{{t.subscription}}</p></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </template>
            <div class="table_button_container">
                <a href="#feedback"><button class="button" onclick="getFeedback()">{{page.orderButton}}</button></a>
            </div>
        </div>
    </section>
    <section class="feedback" id="feedback">
        <div class="container">
            <h2 class="container__title">{{page.feedback.title}}</h2>
            <form id="form_feedback">
                <div class="form_container_items">
                    <label for="form_tariff_title">{{page.feedback.labels.tariff}}</label>
                    <select class="input_field" id="form_tariff_title" name="form_tariff_title">
                        <option value="basic">{{page.tiers.0.label}}</option>
                        <option value="standart">{{page.tiers.1.label}}</option>
                        <option value="premium">{{page.tiers.2.label}}</option>
                    </select>
                </div>
                <div class="form_container_items">
                    <label for="form_tariff_purchase_or_subscription">{{page.feedback.labels.deal}}</label>
                    <select class="input_field" id="form_tariff_purchase_or_subscription" name="form_tariff_purchase_or_subscription">
                        <option value="purchase">{{page.feedback.dealOptions.0.label}}</option>
                        <option value="subscription">{{page.feedback.dealOptions.1.label}}</option>
                    </select>
                </div>
                <div class="form_container_items">
                    <label for="form_tariff_name">{{page.feedback.labels.name}}</label>
                    <input class="input_field" id="form_tariff_name" required>
                </div>
                <div class="form_container_items">
                    <label for="form_tariff_email">{{page.feedback.labels.email}}</label>
                    <input type="email" class="input_field" id="form_tariff_email" required>
                </div>
                <div class="form_container_items">
                    <label for="form_tariff_phone">{{page.feedback.labels.phone}}</label>
                    <input class="input_field form_tariff_phone" id="form_tariff_phone" placeholder="{{page.feedback.phonePlaceholder}}" required>
                </div>
                <div class="form_container_items">
                    <label for="form_tariff_comment">{{page.feedback.labels.comment}}</label>
                    <textarea class="input_field" id="form_tariff_comment"></textarea>
                </div>
                <div class="form_container_items">
                    <label for="form_tariff_number" id="form_tariff_number_label"></label>
                    <input class="input_field" id="form_tariff_number">
                </div>
                <div class="form_container_items">
                    <label for="form_tariff_confirmation"><input id="form_tariff_confirmation" type="checkbox" required> {{page.feedback.labels.confirmationPrefix}}<a href="{{root}}{{page.feedback.termsHref}}" id="confirmation_a">{{page.feedback.labels.confirmationLink}}</a>{{page.feedback.labels.confirmationSuffix}}</label>
                </div>
                <div class="form_buttons">
                    <input class="button button_form" type="reset" value="{{page.feedback.labels.reset}}">
                    <input class="button button_form" type="button" value="{{page.feedback.labels.submit}}" onclick="send()">
                </div>
            </form>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="parallax_footer_logo">
                <div class="footer_container_logo">
                    <a href="{{site.foundationUrl}}">
                        <img class="logo-a__Found" src="{{root}}{{site.assets.foundationLogo}}" alt="{{site.assets.foundationAlt}}">
                    </a>
                    <a href="#">
                        <img class="logo-a__Company" src="{{root}}{{site.assets.companyLogo}}" alt="{{site.assets.companyLogoAlt}}">
                    </a>
                </div>
                <div class="container_logo_footer">
                    <template data-repeat="site.socials" data-as="s">
                        <a href="{{s.url}}">
                            <img src="{{root}}{{s.icon}}" alt="{{s.label}}" class="logo_footer">
                        </a>
                    </template>
                </div>
            </div>
            <div class="container_footer_text">
                <p class="footer__copyright">{{site.footer.copyright}}</p>
                <a href="{{site.footer.companyLink.href}}" class="footer_link">{{site.footer.companyLink.label}}</a>
            </div>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-2.2.4.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.maskedinput/1.4.1/jquery.maskedinput.min.js"></script>
</body>

</html>
