<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{site.meta.terms.title}}</title>
    <link rel="icon" href="{{root}}{{site.assets.favicon}}">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/style_adaptation.css">
    <script defer src="../js/data.js"></script>
    <script defer src="../js/main.js"></script>
</head>
<body data-page="terms" data-root="../">
    <header class="header">
        <div class="container">
            <div class="header_logo">
                <a href="#">
                    <img class="logo-a__Company" src="{{root}}{{site.assets.companyLogo}}" alt="{{site.assets.companyLogoAlt}}">
                </a>
                <div class="header_menu">
                    <div class="menu_menu-burger">
                        <span></span>
                    </div>
                    <nav class="header-menu__body">
                        <ul class="header-menu__list">
                            <template data-repeat="site.nav" data-as="n">
                                <li><a href="{{root}}{{n.href}}" class="header-menu__link">{{n.label}}</a></li>
                            </template>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <template data-repeat="page.sections" data-as="s">
        <section class="terms_container" id="{{s.id}}">
            <div class="container">
                <h2 data-if="s.level === '2'" class="container__title">{{s.title}}</h2>
                <h3 data-if="s.level === '3'" class="container__title">{{s.title}}</h3>
                <template data-repeat="s.items" data-as="it">
                    <p data-if="it.type === 'p'" data-html="it.html"></p>
                    <ul data-if="it.type === 'ul'" style="list-style-type:disc">
                        <template data-repeat="it.items" data-as="li">
                            <li>{{li}}</li>
                        </template>
                    </ul>
                </template>
            </div>
        </section>
    </template>

    <footer class="footer">
        <div class="container">
            <div class="parallax_footer_logo">
                <div class="footer_container_logo">
                    <a href="{{site.foundationUrl}}">
                        <img class="logo-a__Found" src="{{root}}{{site.assets.foundationLogo}}" alt="{{site.assets.foundationAlt}}">
                    </a>
                    <a href="#">
                        <img class="logo-a__Company" src="{{root}}{{site.assets.companyLogo}}" alt="{{site.assets.companyLogoAlt}}">
                    </a>
                </div>
                <div class="container_logo_footer">
                    <template data-repeat="site.socials" data-as="s">
                        <a href="{{s.url}}">
                            <img src="{{root}}{{s.icon}}" alt="{{s.label}}" class="logo_footer">
                        </a>
                    </template>
                </div>
            </div>
            <div class="container_footer_text">
                <p class="footer__copyright">{{site.footer.copyright}}</p>
                <a href="{{site.footer.companyLink.href}}" class="footer_link">{{site.footer.companyLink.label}}</a>
            </div>
        </div>
    </footer>
</body>

</html>
